flutter_launcher_icons:
  #  image_path: "assets/images/icon-128x128.png"
  android: true # can specify file name here e.g. "ic_launcher"
  image_path_android: "assets/raster/icon/icon.png"
  adaptive_icon_background: "assets/raster/icon/icon_background.png" # only available for Android 8.0 devices and above
  adaptive_icon_foreground: "assets/raster/icon/icon_monochrome.png" # only available for Android 8.0 devices and above
  adaptive_icon_monochrome: "assets/raster/icon/icon_monochrome.png" # only available for Android 13 devices and above
  adaptive_icon_foreground_inset: 20 # only available for Android 8.0 devices and above
  min_sdk_android: 21 # android min sdk min:16, default 21
  ios: true # can specify file name here e.g. "My-Launcher-Icon"
  image_path_ios: "assets/raster/icon/icon.png"
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "assets/raster/icon/icon_monochrome.png"
  image_path_ios_tinted_grayscale: "assets/raster/icon/icon_monochrome.png"
  desaturate_tinted_to_grayscale_ios: true
  # background_color_ios: "#ffffff"
